<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cranes Game</title>
    <style>
      :root {
        color-scheme: dark;
        --hud-bg: rgba(12, 14, 18, 0.72);
        --hud-fg: #e6e9ef;
        --hud-dim: #8b94a5;
        --hud-accent: #ffce54;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0c0e12; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }

      .hud {
        position: fixed;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--hud-fg);
        background: var(--hud-bg);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 10px 12px;
        pointer-events: none;
        user-select: none;
      }
      #hud-stats { top: 12px; left: 12px; min-width: 168px; }
      #hud-help  { bottom: 12px; left: 12px; }
      #hud-legend { top: 12px; right: 12px; }

      .hud dl { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin: 0; }
      .hud dt { color: var(--hud-dim); }
      .hud dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      .hud h2 {
        margin: 0 0 6px; font-size: 11px; letter-spacing: 0.09em;
        text-transform: uppercase; color: var(--hud-accent); font-weight: 600;
      }
      .hud kbd {
        background: rgba(255, 255, 255, 0.1); border-radius: 3px;
        padding: 1px 5px; font: inherit;
      }
      .swatch {
        display: inline-block; width: 10px; height: 10px; border-radius: 2px;
        margin-right: 7px; vertical-align: -1px; border: 1px solid rgba(0, 0, 0, 0.35);
      }
      .legend-row { white-space: nowrap; }
      .legend-row .tag { color: var(--hud-dim); }

      /* HUD panels step aside while the drawer is open. */
      body.settings-open #hud-legend,
      body.settings-open #hud-help { opacity: 0; transition: opacity 0.12s ease; }

      /* --- settings drawer ------------------------------------------------ */
      .settings {
        position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 92vw;
        display: flex; flex-direction: column;
        background: rgba(14, 17, 22, 0.94);
        backdrop-filter: blur(10px);
        border-left: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--hud-fg);
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
        transform: translateX(100%);
        transition: transform 0.18s ease;
        z-index: 20;
      }
      .settings.is-open { transform: translateX(0); }

      .settings-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        flex: 0 0 auto;
      }
      .settings-header h1 {
        margin: 0; font-size: 13px; letter-spacing: 0.09em;
        text-transform: uppercase; color: var(--hud-accent); font-weight: 600;
      }
      .settings-close {
        background: none; border: 0; color: var(--hud-dim);
        font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px;
      }
      .settings-close:hover { color: var(--hud-fg); }

      .settings-body { flex: 1 1 auto; overflow-y: auto; padding: 4px 16px 16px; }
      .settings-body h2 {
        margin: 18px 0 8px; font-size: 10px; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--hud-dim); font-weight: 600;
      }

      .settings-row { margin-bottom: 12px; }
      .settings-label { display: block; margin-bottom: 5px; font-size: 12.5px; }
      .settings-controls { display: flex; align-items: center; gap: 9px; }
      .settings-controls input[type='range'] { flex: 1 1 auto; min-width: 0; accent-color: var(--hud-accent); }
      .settings-number {
        width: 68px; flex: 0 0 auto;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 4px; color: var(--hud-fg);
        padding: 3px 6px; font: inherit; font-variant-numeric: tabular-nums;
      }
      .settings-unit { flex: 0 0 auto; width: 30px; color: var(--hud-dim); font-size: 11px; }
      .settings-hint { margin: 4px 0 0; font-size: 11px; color: var(--hud-dim); }

      .settings-footer {
        flex: 0 0 auto; padding: 12px 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.09);
      }
      .settings-reset {
        width: 100%; padding: 7px; cursor: pointer;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 5px; color: var(--hud-fg); font: inherit;
      }
      .settings-reset:hover { background: rgba(255, 255, 255, 0.14); }
      .settings-note { display: block; margin-top: 8px; font-size: 11px; color: var(--hud-dim); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
